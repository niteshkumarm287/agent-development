name: Auto-generate README

on:
  push:
    branches:
      - main

    paths-ignore:
      - 'README.md'
      - '.github/**'

permissions:
  contents: write
  id-token: write

jobs:
  generate-readme:
    runs-on: ubuntu-latest

    env:
      GCP_PROJECT_ID: game-d8160
      GCP_REGION: global

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: projects/319512124676/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: readme-gen-sa@game-d8160.iam.gserviceaccount.com

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r auto-readme-generator-v2/requirements.txt

      - name: Verify Google Cloud Auth
        run: |
          gcloud auth list
          gcloud config list
        continue-on-error: true

      - name: Generate README
        run: |
          python auto-readme-generator-v2/readme_gen.py .

      - name: Commit README back to repository
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          commit_message: "docs: auto-update README [skip ci]"
          file_pattern: README.md
